<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Companion-App | COSMO CONSULT</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="icon" href="assets/icons/cosmo-logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/portal.css">
  <link rel="stylesheet" href="css/companion.css?v=2">
</head>
<body>
  <header class="top">
    <a class="brand" href="portal.html"><img src="assets/cosmo-logo-horizontal-weiss-gold.png" alt="COSMO CONSULT" width="200"><span id="app-name">Companion-App</span></a>
    <div class="actions">
      <label class="usr">Angemeldet als <select id="user-sel"></select></label>
      <button id="bell" class="kbd bell" type="button" aria-haspopup="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10 21a2 2 0 0 0 4 0"/></svg><span id="bell-n" class="bell-n" hidden></span></button>
      <a class="kbd" href="portal.html" target="_top">← Portal</a>
      <button id="print" class="kbd" type="button">Drucken</button>
      <button id="reset" class="kbd" type="button">Demo zurücksetzen</button>
    </div>
  </header>
  <div id="notif" class="notif" role="region" aria-label="Mitteilungen" hidden></div>
  <main class="wrap app" id="app"></main>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <dialog id="form-dlg">
    <form method="dialog" id="form">
      <header><h2 id="form-title"></h2><button type="button" class="x" id="form-x" aria-label="Schließen">×</button></header>
      <div id="form-fields" class="fields"></div>
      <footer><button type="button" class="btn" id="form-cancel">Abbrechen</button><button type="submit" class="btn primary">Bestätigen</button></footer>
    </form>
  </dialog>
  <dialog id="detail-dlg"><div id="detail"></div></dialog>
  <dialog id="sign-dlg">
    <form method="dialog" id="sign-form">
      <header><h2 id="sign-title"></h2><button type="button" class="x" id="sign-x" aria-label="Schließen">×</button></header>
      <div class="fields">
        <p><b id="sign-what"></b><br><span class="muted small">Angemeldet: <span id="sign-user"></span></span></p>
        <div><h3>Vorschau der Folgen</h3><ul class="tl" id="sign-prev"></ul><p class="muted small">Nichts wird ausgeführt, bevor Sie bestätigen.</p></div>
        <div id="sign-sig" hidden><p class="small">Bedeutung der Signatur: <b id="sign-meaning"></b></p><label>Passwort zur Re-Authentifizierung (Demo: 1234)<input id="sign-pw" type="password" autocomplete="off"></label><p id="sign-err" class="verdict bad" hidden>Re-Authentifizierung fehlgeschlagen. Der Versuch wurde im Prüfpfad protokolliert.</p></div>
      </div>
      <footer><button type="button" class="btn" id="sign-cancel">Verwerfen</button><button type="submit" class="btn primary" id="sign-ok">Bestätigen und ausführen</button></footer>
    </form>
  </dialog>
  <script src="js/sha256.js"></script>
  <script src="js/companion.js?v=2"></script>
  <script src="js/companion-apps.js?v=2"></script>
  <script src="js/companion-governance.js?v=2"></script>
  <script src="js/present-bridge.js"></script>
  <script>CC.run(new URLSearchParams(location.search).get('id'));</script>
</body>
</html>
