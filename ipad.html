<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>eMBR / eDHR · iPad-Ansicht</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body { background: #1d1f23; overflow: hidden; }
    /* iPad Pro 11" quer: 1194 x 834 CSS-Pixel, wird bei kleinem Fenster skaliert */
    .stage { position: absolute; left: 50%; top: 50%; width: 1194px; height: 834px; }
    .ipad { box-sizing: border-box; width: 100%; height: 100%; padding: 28px; border-radius: 56px; background: #0b0b0d; box-shadow: 0 0 0 3px #3a3d44, 0 30px 80px rgb(0 0 0 / .6); position: relative; }
    .ipad::before { content: ""; position: absolute; top: 12px; left: 50%; width: 8px; height: 8px; margin-left: -4px; border-radius: 50%; background: #25272c; }
    iframe { width: 100%; height: 100%; border: 0; border-radius: 28px; background: #fff; display: block; }
  </style>
</head>
<body>
  <div class="stage" id="stage"><div class="ipad"><iframe id="f" src="index.html" title="App"></iframe></div></div>
  <script>
    const src = new URLSearchParams(location.search).get('src');
    if (src && /^(app|index)\.html/.test(src)) document.getElementById('f').src = src;
    function fit() {
      const s = Math.min(innerWidth / 1260, innerHeight / 900, 1);
      document.getElementById('stage').style.transform = 'translate(-50%, -50%) scale(' + s + ')';
    }
    addEventListener('resize', fit);
    fit();
  </script>
</body>
</html>
