<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Referentenansicht</title>
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/presenter.css">
</head>
<body>
  <header class="top">
    <a class="btn" href="portal.html">← Portal</a>
    <h1 id="title">Referentenansicht</h1>
    <select id="app-sel" aria-label="Mockup wählen"></select>
    <span id="conn" class="chip off" role="status">Mockup nicht verbunden</span>
    <button id="open" class="btn primary">Mockup-Fenster öffnen</button>
    <button id="reset" class="btn">Demo zurücksetzen</button>
    <span id="clock" class="clock" aria-label="Vortragszeit">00:00</span>
    <button id="clock-btn" class="btn">Start</button>
  </header>
  <main class="grid">
    <nav class="steps" id="steps" aria-label="Storyline"></nav>
    <section class="stage" id="stage"></section>
    <aside class="gloss">
      <input id="gq" type="search" placeholder="Glossar durchsuchen" aria-label="Glossar durchsuchen">
      <label class="chk"><input id="gall" type="checkbox"> Alle Begriffe</label>
      <dl id="gl"></dl>
    </aside>
  </main>
  <script src="js/presenter-data.js"></script>
  <script src="js/presenter-acts.js"></script>
  <script src="js/presenter.js"></script>
</body>
</html>
